<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Write &amp; Edit Story — BlogSpace</title>
    <meta name="description" content="Create, format, and publish your story on BlogSpace." />
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body class="editor-page-wrapper">
    <!-- Top Editor Header -->
    <header class="editor-header-bar">
      <div class="editor-header-left">
        <a href="dashboard.html" class="brand-logo" aria-label="Return to Dashboard">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
          <span>BlogSpace</span>
        </a>
        <div class="editor-status-indicator">
          <span>&bull;</span>
          <span id="editor-page-heading">Write New Story</span>
        </div>
      </div>

      <div class="editor-header-actions">
        <button type="button" class="btn btn-outline btn-sm" id="cancel-edit-btn">Cancel</button>
        <button type="button" class="btn btn-secondary btn-sm" id="save-draft-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>Save Draft</span>
        </button>
        <button type="button" class="btn btn-primary btn-sm" id="publish-blog-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Publish Story</span>
        </button>
      </div>
    </header>

    <!-- Editor Main Workspace Container -->
    <main class="editor-body-container">
      <form id="blog-editor-form" novalidate>
        <!-- Story Title Input -->
        <input 
          type="text" 
          id="blog-title" 
          class="editor-title-input" 
          placeholder="Story Title..." 
          required 
          autocomplete="off"
          aria-label="Story Title"
        />

        <!-- Short Description / Subtitle Input -->
        <textarea 
          id="blog-description" 
          class="editor-desc-input" 
          placeholder="Write a clear, captivating one or two-sentence description or subtitle for your story..." 
          rows="2"
          required
          aria-label="Story Excerpt / Subtitle"
        ></textarea>

        <!-- Story Metadata Settings Panel (Category + Cover Image URL) -->
        <div class="editor-meta-panel">
          <!-- Category Selector -->
          <div class="form-group" style="margin-bottom: 0;">
            <label for="blog-category" class="form-label">Category</label>
            <select id="blog-category" class="form-input" required>
              <option value="Technology">Technology</option>
              <option value="Design">Design</option>
              <option value="Productivity">Productivity</option>
              <option value="Culture">Culture</option>
              <option value="Business">Business</option>
              <option value="Lifestyle">Lifestyle</option>
            </select>
            <span style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.35rem;">Choose the primary editorial discipline.</span>
          </div>

          <!-- Cover Image URL & Presets -->
          <div class="form-group" style="margin-bottom: 0;">
            <label for="blog-cover-url" class="form-label">Cover Image URL</label>
            <input 
              type="url" 
              id="blog-cover-url" 
              class="form-input" 
              placeholder="https://images.unsplash.com/..." 
              value="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&q=80"
            />
            
            <!-- Quick preset buttons -->
            <div class="preset-chips-list" id="cover-presets-list">
              <!-- Rendered dynamically by js/blog.js -->
            </div>

            <!-- Image Preview Box -->
            <div class="cover-preview-box" id="cover-preview-container">
              <img 
                id="cover-preview-img" 
                src="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&q=80" 
                alt="Story cover preview" 
                class="cover-preview-img" 
              />
            </div>
          </div>
        </div>

        <!-- Markdown Toolbar & Write / Live Preview Tabs -->
        <div class="editor-controls-bar">
          <div class="editor-toolbar" role="toolbar" aria-label="Editor formatting tools">
            <button type="button" class="toolbar-btn" data-format="bold" title="Bold (Ctrl+B)" aria-label="Format bold"><strong>B</strong></button>
            <button type="button" class="toolbar-btn" data-format="italic" title="Italic (Ctrl+I)" aria-label="Format italic"><em>I</em></button>
            <div class="toolbar-divider"></div>
            <button type="button" class="toolbar-btn" data-format="h2" title="Section Heading (H2)" aria-label="Heading 2">H2</button>
            <button type="button" class="toolbar-btn" data-format="h3" title="Subsection Heading (H3)" aria-label="Heading 3">H3</button>
            <div class="toolbar-divider"></div>
            <button type="button" class="toolbar-btn" data-format="quote" title="Blockquote" aria-label="Quote">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></svg>
            </button>
            <button type="button" class="toolbar-btn" data-format="ul" title="Bullet List" aria-label="List">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
            <button type="button" class="toolbar-btn" data-format="code" title="Inline Code" aria-label="Code">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </button>
          </div>

          <div class="editor-tab-group">
            <button type="button" class="editor-tab-btn active" id="editor-tab-write">Write</button>
            <button type="button" class="editor-tab-btn" id="editor-tab-preview">Live Preview</button>
          </div>
        </div>

        <!-- Content Input Area -->
        <textarea 
          id="blog-content" 
          class="editor-textarea" 
          placeholder="Start drafting your article here...

Use ## for headings
Use > for blockquotes
Use - for bullet lists"
          required
          aria-label="Story Content"
        ></textarea>

        <!-- Live Preview Box (Toggled via tab) -->
        <div id="editor-live-preview" class="editor-live-preview hidden" aria-live="polite"></div>

        <!-- Live Word & Reading Time Footer -->
        <div class="editor-stats-footer">
          <div>
            <span id="editor-word-count">0 words</span> &bull; 
            <span id="editor-reading-time">~1 min read</span>
          </div>
          <div>
            <span>Format: Markdown supported</span>
          </div>
        </div>
      </form>
    </main>

    <script type="module">
      import { initBlogEditor } from '/js/blog.js';
      initBlogEditor();
    </script>
  </body>
</html>
